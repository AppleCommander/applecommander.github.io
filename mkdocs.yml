# Project information:
site_name: 'AppleCommander'
nav:
  - Overview: 'index.md'
  - Installation:
    - installation/index.md
    - 'Application': installation/application.md
    - 'Command Line': installation/command-line.md
    - 'Original installation notes': installation/original.md
  - Screenshots: 'using.md'
  - Command-line tools:
    - cli/index.md
    - ac: cli/ac.md
    - acx: cli/acx.md
    - acdasm: cli/acdasm.md
    - asu: cli/asu.md
    - bt: cli/bt.md
    - st: cli/st.md
  - Developer Notes:
    - 'Maven/Gradle GAV': dev-notes/gav.md
    - 'Updated API and UML': dev-notes/redesign.md
    - 'Historical UML diagrams': dev-notes/uml.md
    - 'Disassembler API': dev-notes/disassembler.md
    - 'AppleSingle API': dev-notes/applesingle.md
    - 'BASIC/Shapes API': dev-notes/bastools.md
    - 'Ant Task': dev-notes/ant.md
    - 'Javadoc': javadoc.md
    - 'cc65 Pipeline': dev-notes/cc65-pipeline.md
  - History:
    - 'Current releases': history/current.md
    - 'Legacy releases':
      - '1.3.5.14 (27-Nov-2013)': history/version13514.md
      - '1.3.5 (01-Jun-2008)': history/version135.md
      - '1.3.4 (31-Mar-2007)': history/version134.md
      - '1.3.3 (18-Jun-2004)': history/version133.md
      - '1.3.2 (05-Jun-2004)': history/version132.md
      - '1.3.1 (12-Dec-2003)': history/version131.md
      - '1.3.0 (04-Dec-2003)': history/version130.md
      - '1.2.3 (13-Apr-2003)': history/version123.md
      - '1.2.2 (15-Mar-2003)': history/version122.md
      - '1.2.1 (01-Mar-2003)': history/version121.md
      - '1.2.0 (11-Feb-2003)': history/version120.md
      - '1.1.1 (30-Nov-2002)': history/version111.md
      - '1.1 (12-Nov-2002)': history/version110.md
      - '1.0 (28-Oct-2002)': history/version100.md

site_description: 'Information site for the AppleCommander suite of tools'
site_author: 'a2geek'
site_url: 'https://applecommander.github.io'

# Repository
remote_branch: master
repo_name: AppleCommander
repo_url: https://github.com/AppleCommander/AppleCommander

# Copyright
copyright: Copyright &copy; 2002 - 2026 Robert Greene

# Configuration
theme:
  name: 'material'
  language: 'en'
  palette:
    primary: 'indigo'
    accent: 'indigo'
  logo: 'images/apple-logo.png'
  favicon: 'images/apple-logo.png'
  features:
    - navigation.indexes
    - content.tabs.link

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Plugins
plugins:
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
